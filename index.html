<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPBoss Style Panel Chart</title>
    
    <!-- Google Fonts for Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0B0F19;
            --container-bg: #111827;
            --row-bg: #1e293b;
            --sidebar-bg: #0f172a;
            --text-main: #FFFFFF;
            --text-muted: #94a3b8;
            --accent-jodi: #22c55e;
            --accent-sunday: #ef4444;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .animated-title {
            font-family: 'Outfit', sans-serif;
            text-align: center;
            font-size: 3.5rem;
            margin-bottom: 25px;
            background: linear-gradient(90deg, #ff007f, #7928ca, #00d2ff, #7928ca, #ff007f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 20px rgba(121, 40, 202, 0.5);
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: gradient-shine 3s linear infinite;
            padding: 10px;
        }

        @keyframes gradient-shine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* --- HOME VIEW CARDS --- */
        #home-view {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .market-card {
            background: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .market-card:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.4);
            box-shadow: 0 8px 15px rgba(59, 130, 246, 0.1);
        }

        .market-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            text-transform: uppercase;
        }

        .market-result {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--accent-jodi);
            background: rgba(0,0,0,0.25);
            padding: 12px 25px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .market-result-patti {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-family: 'Outfit', sans-serif;
        }

        .panel-btn, .back-btn {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 1.05rem;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .panel-btn:hover, .back-btn:hover {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        .back-btn {
            margin-bottom: 20px;
            align-self: flex-start;
        }

        /* --- DPBoss Style Row (PANEL VIEW) --- */
        .week-row {
            display: flex;
            width: 100%;
            background: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .week-row:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.4);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .date-sidebar {
            width: 130px;
            background: var(--sidebar-bg);
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            border-right: 2px solid var(--border-color);
            flex-shrink: 0;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        .date-sidebar span.to {
            color: #4ade80;
            font-size: 0.75rem;
        }

        .boxes-container { display: flex; flex-grow: 1; }

        .day-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: calc(100% / 7);
            border-right: 1px solid var(--border-color);
            padding: 8px 2px;
            background: rgba(255, 255, 255, 0.02);
        }

        .day-box:last-child { border-right: none; }
        .day-box:hover { background: rgba(255, 255, 255, 0.05); }

        .patti {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
        }

        .jodi {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent-jodi);
            margin: 4px 0;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 2px 5px rgba(34, 197, 94, 0.2);
        }

        .empty-day .jodi {
            color: var(--accent-sunday);
            text-shadow: 0 2px 5px rgba(239, 68, 68, 0.2);
        }

        /* Day Labels Header Row */
        .header-row {
            display: flex;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 4px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            color: white;
            text-transform: uppercase;
        }
        
        .header-sidebar {
            width: 130px;
            background: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            flex-shrink: 0;
            letter-spacing: 1px;
        }
        
        .header-days {
            display: flex;
            flex-grow: 1;
            background: #1d4ed8;
        }

        .header-day-col {
            width: calc(100% / 7);
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid rgba(255,255,255,0.2);
            padding: 10px 0;
        }
        .header-day-col:last-child { border-right: none; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4B5563; }

        @media (max-width: 700px) {
            .market-card { flex-direction: column; gap: 15px; }
            .date-sidebar { width: 90px; font-size: 0.7rem; }
            .header-sidebar { width: 90px; font-size: 0.7rem; }
            .jodi { font-size: 1.1rem; }
            .patti { font-size: 0.65rem; letter-spacing: 1px; }
            .header-day-col { font-size: 0.7rem; }
        }

        /* Footer styling */
        .footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            width: 100%;
            max-width: 900px;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 1px;
        }

        .footer span {
            color: #4ade80;
            font-weight: 700;
        }
    </style>
</head>

<body>

    <h2 class="animated-title">DPBOSSPAK</h2>

    <!-- HOME VIEW (3 Cards) -->
    <div id="home-view" class="container">
        <!-- Cards will be injected via JS -->
    </div>

    <!-- PANEL VIEW -->
    <div id="panel-view" class="container" style="display: none;">
        
        <button class="back-btn" onclick="showHome()">← Back To Home</button>

        <!-- Day Table Headers -->
        <div class="header-row">
            <div class="header-sidebar">Date</div>
            <div class="header-days">
                <div class="header-day-col">Mon</div>
                <div class="header-day-col">Tue</div>
                <div class="header-day-col">Wed</div>
                <div class="header-day-col">Thu</div>
                <div class="header-day-col">Fri</div>
                <div class="header-day-col">Sat</div>
                <div class="header-day-col" style="background: rgba(239, 68, 68, 0.5);">Sun</div>
            </div>
        </div>

        <!-- Inject list data here -->
        <div id="list" style="display: flex; flex-direction: column; gap: 8px;"></div>
    </div>

    <!-- Rights Reserved Footer -->
    <div class="footer">
        &copy; 2026 <span>DPBOSSPAK</span>. All Rights Reserved.
    </div>

    <!-- Include static data generated by python -->
    <script src="data.js"></script>

    <script>
        // 🔹 Navigation Functions
        function showPanel() {
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('panel-view').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        function showHome() {
            document.getElementById('panel-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'flex';
            window.scrollTo(0, 0);
        }

        // 🔹 Fetch static pairs by Date
        function getStaticPairs(dateObj) {
            let y = dateObj.getFullYear();
            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let d = String(dateObj.getDate()).padStart(2, '0');
            let dateStr = `${y}-${m}-${d}`;
            
            if (typeof staticData !== 'undefined' && staticData[dateStr]) {
                return staticData[dateStr];
            }
            return { first: "***", middle: "**", third: "***" };
        }

        // 🔹 Generate Home View Cards
        function generateHomeCards() {
            let container = document.getElementById("home-view");
            let today = new Date();
            let isSunday = (today.getDay() === 0);
            
            let { first, middle, third } = getStaticPairs(today);

            // If it's closed today
            if (isSunday || first === "***") {
                first = "***"; middle = "**"; third = "***";
            }

            let markets = ["BABAR", "786", "JINNA"];
            let html = "";

            markets.forEach(market => {
                html += `
                    <div class="market-card">
                        <div class="market-title">${market}</div>
                        <div class="market-result">
                            <div class="market-result-patti">${first}</div>
                            <div>${middle}</div>
                            <div class="market-result-patti">${third}</div>
                        </div>
                        <button class="panel-btn" onclick="showPanel()">Panel Chart</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 🔹 Generate the weekly layout from Jan 1st to Today
        function generateYearToDate() {
            let container = document.getElementById("list");
            let htmlChunks = [];

            let today = new Date();
            let currentYear = today.getFullYear();
            
            let startDate = new Date(currentYear, 0, 1);
            let startDay = startDate.getDay();
            let offsetToMonday = startDay === 0 ? -6 : 1 - startDay;
            startDate.setDate(startDate.getDate() + offsetToMonday);

            today.setHours(23, 59, 59, 999);
            let currentDate = new Date(startDate); 

            while (currentDate <= today) {
                let weekMon = new Date(currentDate);
                let weekSun = new Date(currentDate);
                weekSun.setDate(weekSun.getDate() + 6);

                let formatDDMM = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
                
                let boxesHtml = "";
                
                for(let i = 0; i < 7; i++) {
                    let loopDate = new Date(currentDate);
                    loopDate.setDate(currentDate.getDate() + i);

                    if (loopDate.getFullYear() < currentYear || loopDate > today) {
                        boxesHtml += `
                            <div class="day-box empty-day">
                                <div class="patti">***</div>
                                <div class="jodi">**</div>
                                <div class="patti">***</div>
                            </div>
                        `;
                    } else {
                        let isSunday = (loopDate.getDay() === 0);

                        if (isSunday) {
                            boxesHtml += `
                                <div class="day-box empty-day">
                                    <div class="patti">***</div>
                                    <div class="jodi">**</div>
                                    <div class="patti">***</div>
                                </div>
                            `;
                        } else {
                            let { first, middle, third } = getStaticPairs(loopDate);
                            boxesHtml += `
                                <div class="day-box">
                                    <div class="patti">${first}</div>
                                    <div class="jodi">${middle}</div>
                                    <div class="patti">${third}</div>
                                </div>
                            `;
                        }
                    }
                }

                let weekRow = `
                    <div class="week-row">
                        <div class="date-sidebar">
                            ${formatDDMM(weekMon)}
                            <span class="to">TO</span>
                            ${formatDDMM(weekSun)}
                        </div>
                        <div class="boxes-container">
                            ${boxesHtml}
                        </div>
                    </div>
                `;

                htmlChunks.unshift(weekRow);
                currentDate.setDate(currentDate.getDate() + 7);
            }
            
            container.innerHTML = htmlChunks.join('');
        }

        // Initialize App
        generateHomeCards();
        generateYearToDate();
    </script>
</body>
</html>
